services:
  postgres:
    image: postgres:17-alpine
    container_name: hamburgueseria-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hamburgueseria}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hamburgueseria}
      POSTGRES_DB: ${POSTGRES_DB:-hamburgueseria}
      TZ: America/Argentina/Buenos_Aires
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-hamburgueseria}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
